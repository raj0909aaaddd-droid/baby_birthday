for(let i=P.length;i--;){const p=P[i];p.l-=dt;if(p.l<=0){if(p.t=='r')boom2(p.x,p.y);P.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const a=Math.min(1,p.l/p.m*2.4);
